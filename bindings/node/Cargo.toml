[package]
name = "lsdocs-rst-node"
description = "Node.js bindings (napi-rs) for lsdocs-rst, the reStructuredText parser."
version = "0.2.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
# Needs Node.js to run; tested with `node --test` instead.
test = false
doctest = false

[lints]
workspace = true

[dependencies]
lsdocs-rst = { workspace = true, features = ["serde"] }
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build.workspace = true
