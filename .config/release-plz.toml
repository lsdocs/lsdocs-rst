# release-plz (https://release-plz.dev), run with --config .config/release-plz.toml.
[workspace]
# Tags are `<crate>/v<version>`.
git_tag_name = "{{ package }}/v{{ version }}"
# The tag workflow (tag.yml) creates the GitHub releases, with gh.
git_release_enable = false
# Publish and tag only when the release PR is merged.
release_always = false
changelog_update = true
# The release PR opens as a draft (release-plz updates it on every push
# to main). Marking it ready for review runs the release builds as a
# dry run (release-check.yml); then merge it to release.
pr_draft = true

# lsdocs-rst's bindings always have its version (bumped with it).
[[package]]
name = "lsdocs-rst"
version_group = "rst"

[[package]]
name = "lsdocs-rst-python"
version_group = "rst"
# Released (tagged, changelog) but not on crates.io; tracked by its tags.
publish = false
git_only = true

[[package]]
name = "lsdocs-rst-node"
version_group = "rst"
# Released (tagged, changelog) but not on crates.io; tracked by its tags.
publish = false
git_only = true

[[package]]
name = "lsdocs-rst-lua"
version_group = "rst"
# Released (tagged, changelog) but not on crates.io; tracked by its tags.
publish = false
git_only = true
