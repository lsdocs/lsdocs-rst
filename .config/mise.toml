# Dev tools for this repository (https://mise.jdx.dev): `mise install`.
# Rust itself comes from rustup, as rust-toolchain.toml says.
[tools]
"cargo:nur" = "0.32.0"
uv = "0.13.9"

[settings]
# Node.js and Python from the version files at the root.
idiomatic_version_file_enable_tools = ["node", "python"]
