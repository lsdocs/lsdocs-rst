# A `<crate>/v<version>` tag (pushed by release.yml after a release PR is
# merged) gets its GitHub release, created with gh. A `lsdocs-rst-python/v*` tag
# also builds the Python package's wheels and sdist and publishes them to
# PyPI (trusted publishing, in the `release` environment).
name: Tag

on:
  push:
    tags: ["*/v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lsdocs/.github/.github/create-release@main

  wheels:
    if: startsWith(github.ref_name, 'lsdocs-rst-python/v')
    uses: lsdocs/.github/.github/workflows/build-wheels.yml@main
    permissions:
      contents: read
    with:
      working-directory: bindings/python

  publish-pypi:
    needs: [release, wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # A tag build: no cache (cache poisoning).
          cache: false
          mise_toml: |
            [tools]
            uv = "0.13.9"
      - run: uv publish --trusted-publishing always dist/*
