# A `<crate>/v<version>` tag (pushed by release.yml after a release PR is
# merged) gets its GitHub release, created with gh. A `lsdocs-rst-python/v*` tag
# also builds the Python package's wheels and sdist and publishes them to
# PyPI (trusted publishing, in the `release` environment). A `lsdocs-rst-node/v*`
# tag builds the napi packages (the main one and one per platform) and
# publishes them to npm the same way, platform packages first. A
# `lsdocs-rst-lua/v*` tag builds the Lua modules (every target and Lua version)
# and the rockspec, and attaches them to its GitHub release, as lsdocs'
# binaries are, then uploads the rockspec to luarocks.org (the
# `release` environment's LUAROCKS_API_KEY; luarocks.org has no trusted
# publishing). The rockspec builds from the tag with cargo.
name: Tag

on:
  push:
    tags: ["*/v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lsdocs/.github/.github/create-release@main

  wheels:
    if: startsWith(github.ref_name, 'lsdocs-rst-python/v')
    uses: lsdocs/.github/.github/workflows/build-wheels.yml@main
    permissions:
      contents: read
    with:
      working-directory: bindings/python

  publish-pypi:
    needs: [release, wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      # Trusted publishing; files already on PyPI are skipped (safe to
      # re-run).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  node-version:
    if: startsWith(github.ref_name, 'lsdocs-rst-node/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"

  npm:
    needs: node-version
    uses: lsdocs/.github/.github/workflows/build-npm.yml@main
    permissions:
      contents: read
    with:
      working-directory: bindings/node
      version: ${{ needs.node-version.outputs.version }}

  publish-npm:
    needs: [release, node-version, npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # npm trusted publishing (and provenance)
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: packages
      # npm 11.15 or later, for trusted publishing and `npm stage`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      # npm trusted publishing needs each package to exist already. For the
      # first release, an npm token (without bypass-2FA) in the `release`
      # environment's NPM_TOKEN secret stages each package instead: npm
      # holds it until a maintainer approves it with 2FA (npmjs.com's
      # Staged Packages tab, or `npm stage approve <id>`). Then set up
      # trusted publishing and delete the secret; see lsdocs/.github's
      # docs/releasing.md.
      - name: Publish, platform packages first
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MAIN: packages/lsdocs-rst-${{ needs.node-version.outputs.version }}.tgz
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
            # Staged, without provenance.
            cmd=(npm stage publish --access public)
          else
            cmd=(npm publish --provenance --access public)
          fi
          # A package whose version is already on npm is skipped (safe to
          # re-run after a partial failure; a staged version not yet
          # approved is not on npm, so reject it before a re-run).
          publish() {
            spec=$(tar -xOzf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              # ./: `npm stage publish` reads `packages/x.tgz` as a GitHub
              # owner/repo, not a file.
              "${cmd[@]}" "./$1"
            fi
          }
          for pkg in packages/*.tgz; do
            [ "$pkg" = "$MAIN" ] || publish "$pkg"
          done
          publish "$MAIN"

  lua-version:
    if: startsWith(github.ref_name, 'lsdocs-rst-lua/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"

  rocks:
    needs: lua-version
    uses: lsdocs/.github/.github/workflows/build-rocks.yml@main
    permissions:
      contents: read
    with:
      working-directory: bindings/lua
      crate: lsdocs-rst-lua
      library: lsdocs_rst_lua
      module: lsdocs_rst
      rockspec: lsdocs-rst.rockspec.in
      version: ${{ needs.lua-version.outputs.version }}

  # The modules (`lsdocs_rst-<version>-<lua>-<target>.tar.gz`) and the
  # rockspec, attached to the release.
  upload-rocks:
    needs: [release, rocks]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rock-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rockspec
          path: dist
      # --clobber: safe to re-run.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release upload "$TAG" dist/*.tar.gz dist/*.rockspec
          --repo "$GITHUB_REPOSITORY" --clobber

  # After the release has its assets: the rockspec (and a source rock packed
  # from the tag) to luarocks.org.
  publish-luarocks:
    needs: upload-rocks
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rockspec
          path: dist
      # Lua with LuaRocks (as build-rocks.yml's lua54-tool).
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # A tag build: no cache (cache poisoning).
          cache: false
          mise_toml: |
            [tools]
            lua = "5.4.9"
      # The account must not require 2FA for uploads (CI cannot enter a
      # code). A version already on luarocks.org is skipped (safe to
      # re-run).
      - name: Upload to luarocks.org
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          rockspec=$(ls dist/*.rockspec)
          if ! out=$(luarocks upload "$rockspec" --temp-key "$LUAROCKS_API_KEY" 2>&1); then
            echo "$out"
            case "$out" in
              *"already exists on the server"*) echo "$rockspec is already on luarocks.org" ;;
              *) exit 1 ;;
            esac
          else
            echo "$out"
          fi
