name: Pages

# Builds the API pages (`nur api`) and publishes them on GitHub Pages
# (https://lsdocs.github.io/lsdocs-rst/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    uses: lsdocs/.github/.github/workflows/pages.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
