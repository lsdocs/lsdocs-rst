[package]
name = "lsdocs-rst"
description = "A reStructuredText parser producing a docutils-style document tree with source spans."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["restructuredtext", "rst", "docutils", "parser"]
categories = ["parser-implementations", "text-processing"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, optional = true }
unicode-normalization.workspace = true

[features]
# Serialize and deserialize settings and document trees.
serde = ["dep:serde"]

[dev-dependencies]
# The tests use the serde feature (settings files of conformance cases).
lsdocs-rst = { path = ".", features = ["serde"] }
serde_json.workspace = true
